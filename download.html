<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Download BixoPDF trial</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/page.css">
<noscript><meta http-equiv="refresh" content="2;url=https://github.com/nimis0612/bixopdf-site/releases/latest/download/BixoPDF-Trial-Setup.exe"></noscript>
</head>
<body>
<!-- The trial buttons come here first: the visit is counted (people, not robots that follow .exe links),
     then the browser goes on to the file on GitHub. ?l=<language>&from=<button> -->
<main>
  <h1 id="h">Your download is starting…</h1>
  <p id="p">BixoPDF-Trial-Setup.exe · 15-day trial · Windows 10 (1809 or later) / 11, 64-bit</p>
  <p><a class="btn" id="a" rel="nofollow" href="https://github.com/nimis0612/bixopdf-site/releases/latest/download/BixoPDF-Trial-Setup.exe">Download now</a></p>
  <p id="n" style="color:var(--ink-soft);font-size:.9rem">If it does not start in a few seconds, press the button.</p>
  <p><a id="b" href="/">← BixoPDF</a></p>
</main>
<script>
(function () {
  var FILE = "https://github.com/nimis0612/bixopdf-site/releases/latest/download/BixoPDF-Trial-Setup.exe";
  var T = {
    en: ["Your download is starting…", "BixoPDF-Trial-Setup.exe · 15-day trial · Windows 10 (1809 or later) / 11, 64-bit", "Download now", "If it does not start in a few seconds, press the button.", "/"],
    ko: ["다운로드를 시작합니다…", "BixoPDF-Trial-Setup.exe · 15일 체험판 · Windows 10(1809 이상)·11, 64비트", "지금 다운로드", "몇 초 안에 시작되지 않으면 단추를 눌러 주십시오.", "/ko/"],
    ja: ["ダウンロードを開始しています…", "BixoPDF-Trial-Setup.exe · 15日間体験版 · Windows 10(1809以降)・11、64ビット", "今すぐダウンロード", "数秒たっても始まらない場合は、ボタンを押してください。", "/ja/"],
    ru: ["Загрузка начинается…", "BixoPDF-Trial-Setup.exe · пробная версия на 15 дней · Windows 10 (1809 и новее) / 11, 64-бит", "Скачать сейчас", "Если загрузка не началась через несколько секунд, нажмите кнопку.", "/ru/"],
    ar: ["يبدأ التنزيل الآن…", "BixoPDF-Trial-Setup.exe · نسخة تجريبية لمدة 15 يومًا · Windows 10 (1809 أو أحدث) / 11، 64 بت", "نزّل الآن", "إذا لم يبدأ التنزيل خلال ثوانٍ، فاضغط الزر.", "/ar/"],
    hi: ["डाउनलोड शुरू हो रहा है…", "BixoPDF-Trial-Setup.exe · 15 दिन का ट्रायल · Windows 10 (1809 या बाद का) / 11, 64-बिट", "अभी डाउनलोड करें", "अगर कुछ सेकंड में शुरू न हो, तो बटन दबाएँ।", "/hi/"]
  };
  var q = new URLSearchParams(location.search);
  var l = (q.get("l") || "").toLowerCase();
  if (!T[l]) l = "en";
  var from = (q.get("from") || "direct").replace(/[^a-z0-9-]/gi, "").slice(0, 40) || "direct";
  var t = T[l];
  document.documentElement.lang = l;
  if (l === "ar") document.documentElement.dir = "rtl";
  document.title = t[2] + " · BixoPDF";
  document.getElementById("h").textContent = t[0];
  document.getElementById("p").textContent = t[1];
  document.getElementById("a").textContent = t[2];
  document.getElementById("n").textContent = t[3];
  document.getElementById("b").href = t[4];

  var gone = false;
  function go() { if (!gone) { gone = true; location.href = FILE; } }
  // GoatCounter: one count per visit as /download/<language>/<button>, then the file.
  window.goatcounter = { no_onload: true };
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://bixopdf.goatcounter.com/count");
  s.onload = function () {
    try { window.goatcounter.count({ path: "/download/" + l + "/" + from, title: "Trial download" }); } catch (e) {}
    setTimeout(go, 700);
  };
  s.onerror = go;                       // blocked by an ad blocker: still give the file
  document.head.appendChild(s);
  setTimeout(go, 2500);                 // the counter is slow: do not keep the visitor waiting
})();
</script>
</body>
</html>
